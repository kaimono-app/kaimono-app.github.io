<body>
<header class="bar">
  <a class="brand" href="../"><span class="seal" aria-hidden="true">買</span>kaimono</a>
</header>
<main class="doc">

<div class="join">
  <h1>Connexion à kaimono</h1>
  <p>Ouverture de l’app…</p>
  <a class="cta" id="open" href="kaimono://">Ouvrir kaimono</a>
  <p class="small">Ouvrez ce lien sur le téléphone où kaimono est installé. Il ne sert qu’une fois et expire au bout d’une heure.</p>
</div>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var hash = q.get('token_hash');
    var type = q.get('type');
    if (!hash || !type) return;
    var url = 'kaimono://auth?token_hash=' + encodeURIComponent(hash) + '&type=' + encodeURIComponent(type);
    document.getElementById('open').href = url;
    location.href = url;
  })();
</script>

</main>
